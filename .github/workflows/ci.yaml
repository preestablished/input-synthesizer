name: ci
on:
  pull_request:
  push:
jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
          # Pinned: an unrelated control-plane HEAD change must never
          # silently change the proto we build against (docs/proto-audit.md).
          ref: proto-v0.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo fmt --all -- --check
        working-directory: repo
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: repo
      - run: cargo build --workspace
        working-directory: repo
      - run: cargo test --workspace
        working-directory: repo
  golden-version-gate:
    # Direct commits to main at green package boundaries are house practice
    # here, so this gate must fire on push as well as pull_request — a
    # PR-only gate would be vacuous (plan 02, ground rules).
    name: golden-version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The shallow default cannot resolve github.event.before or
          # git show $BASE:Cargo.toml.
          fetch-depth: 0
      - name: check golden/version coupling
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # All-zeros (new branch) or unknown-to-this-clone (force-push)
          # base SHAs fall back to the merge-base with the default branch.
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
          fi
          GOLDEN_GATE_BASE="$BASE" ci/check-golden-version.sh
  bench:
    name: bench (${{ matrix.arch }})
    # Stretch/M1 bench harness; keep CI green while it lands incrementally.
    continue-on-error: true
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/control-plane
          path: control-plane
          ref: proto-v0.2.0
      - uses: dtolnay/rust-toolchain@stable
      # No `|| true` here: continue-on-error at the job level already keeps
      # this non-blocking, and swallowing the exit code would hide even a
      # compile error behind a green checkmark.
      - name: bench_propose (non-gating)
        run: cargo test -p synth-gen --release bench_propose -- --ignored --nocapture
        working-directory: repo
